spring.application.name=aura
server.port=8986
server.address=0.0.0.0

#ConexionBBDD
spring.datasource.url=jdbc:mariadb://5.34.148.141:3306/aura
spring.datasource.username=root
spring.datasource.password=Bagf1986..
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP - Pool de conexiones
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=SET SESSION sql_mode='STRICT_TRANS_TABLES'
spring.datasource.hikari.test-on-borrow=true
spring.datasource.hikari.test-on-return=false
spring.datasource.hikari.test-while-idle=true
spring.datasource.hikari.validation-query-timeout=5000

# Otras configuraciones relacionadas con Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB106Dialect
# Permite actualizar automáticamente el esquema de la base de datos
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en el log
spring.jpa.show-sql=false
# Desactiva el patrón "Open Session in View" (mejor para rendimiento y evitar problemas de LazyInitialization)
spring.jpa.open-in-view=false
# Formatea las consultas SQL en los logs para mayor legibilidad
spring.jpa.properties.hibernate.format_sql=true
# Activa la generación de estadísticas de Hibernate (útil para depuración y análisis de rendimiento)
#spring.jpa.properties.hibernate.generate_statistics=true

#Configuracion SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html