spring.application.name=aura
server.port=8986

#ConexionBBDD
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/aura
spring.datasource.username=root
spring.datasource.password=Bagf1986..
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración del Pool de Conexiones HikariCP (optimizado)
# Número máximo de conexiones en el pool
spring.datasource.hikari.maximum-pool-size=20
# Número mínimo de conexiones inactivas en el pool
spring.datasource.hikari.minimum-idle=5
# Tiempo máximo que una conexión puede estar inactiva en el pool (30 segundos)
spring.datasource.hikari.idle-timeout=30000
# Tiempo máximo de vida de una conexión en el pool (30 minutos)
spring.datasource.hikari.max-lifetime=1800000
# Timeout para obtener una conexión del pool (30 segundos)
spring.datasource.hikari.connection-timeout=30000
# Tiempo máximo que una conexión puede estar fuera del pool antes de ser considerada leaked (10 minutos)
spring.datasource.hikari.leak-detection-threshold=600000
# Query de test para validar conexiones
spring.datasource.hikari.connection-test-query=SELECT 1

# Otras configuraciones relacionadas con Hibernate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
# Permite actualizar automáticamente el esquema de la base de datos
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en el log
spring.jpa.show-sql=false
# Desactiva el patrón "Open Session in View" (mejor para rendimiento y evitar problemas de LazyInitialization)
spring.jpa.open-in-view=false
# Formatea las consultas SQL en los logs para mayor legibilidad
spring.jpa.properties.hibernate.format_sql=true
# Activa la generación de estadísticas de Hibernate (útil para depuración y análisis de rendimiento)
#spring.jpa.properties.hibernate.generate_statistics=true

# Configuración de timeouts de servidor
# Timeout para conexiones HTTP idle en Tomcat (60 segundos)
server.tomcat.connection-timeout=60000
# Timeout para mantener viva una conexión HTTP (30 segundos)
server.servlet.session.timeout=30m

# Configuración de threading para manejar múltiples peticiones
# Número máximo de threads para procesar requests
server.tomcat.threads.max=200
# Número mínimo de threads siempre disponibles
server.tomcat.threads.min-spare=10
# Tamaño máximo de la cola de peticiones pendientes
server.tomcat.accept-count=100
# Número máximo de conexiones simultáneas que el servidor puede aceptar
server.tomcat.max-connections=10000

#Configuracion SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.base-dir=uploads/tareas

