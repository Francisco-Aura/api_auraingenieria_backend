spring.application.name=aura
server.port=8986
# Solo escucha en el propio equipo: se llega al backend a través de nginx (que está en
# la misma máquina), nunca directamente desde la red. AURA_SERVER_ADDRESS=0.0.0.0 lo abre.
server.address=${AURA_SERVER_ADDRESS:127.0.0.1}

#ConexionBBDD
# La conexion de cada puesto de desarrollo va en application-local.properties
# (misma carpeta, excluido de git): sus valores prevalecen sobre estos.
spring.config.import=optional:classpath:application-local.properties
# Credenciales sobrescribibles por variables de entorno (AURA_DB_URL, AURA_DB_USERNAME,
# AURA_DB_PASSWORD). PENDIENTE: rotar esta contraseña, quitarla del repositorio y no usar root.
spring.datasource.url=${AURA_DB_URL:jdbc:mariadb://127.0.0.1:3306/aura}
spring.datasource.username=${AURA_DB_USERNAME:root}
spring.datasource.password=${AURA_DB_PASSWORD:Bagf1986..}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Respuestas JSON comprimidas (un listado de puntos de suministro pasa de ~2 MB a ~200 KB).
# Si nginx también comprime, no lo hace dos veces: respeta la respuesta ya comprimida
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=2KB

# Configuración del Pool de Conexiones HikariCP (optimizado para BD remota)
# Número máximo de conexiones en el pool
spring.datasource.hikari.maximum-pool-size=10
# Pool fijo (lo que recomienda Hikari): tras un rato sin uso no hay que abrir de nuevo,
# una a una, las conexiones con la BD remota justo cuando llega una ráfaga de peticiones
spring.datasource.hikari.minimum-idle=10
# Tiempo máximo que una conexión puede estar inactiva en el pool (8 minutos)
# Debe ser menor que max-lifetime
spring.datasource.hikari.idle-timeout=480000
# Tiempo máximo de vida de una conexión (9 minutos = 540s)
# Debe ser menor que wait_timeout del servidor MariaDB 
spring.datasource.hikari.max-lifetime=540000
# Timeout para obtener una conexión del pool (30 segundos)
spring.datasource.hikari.connection-timeout=30000
# Aviso en el log si una conexión pasa más de 2 minutos fuera del pool (posible fuga).
# Tiene que ser menor que max-lifetime: con 10 minutos Hikari lo desactivaba al arrancar
spring.datasource.hikari.leak-detection-threshold=120000
# Keepalive agresivo: ping cada 60 segundos para mantener conexiones vivas en BD remota
spring.datasource.hikari.keepalive-time=60000
# Query de test para validar conexiones antes de usarlas
spring.datasource.hikari.connection-test-query=SELECT 1

# Otras configuraciones relacionadas con Hibernate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
# Permite actualizar automáticamente el esquema de la base de datos
spring.jpa.hibernate.ddl-auto=none
# Muestra las consultas SQL en el log
spring.jpa.show-sql=false
# Desactiva el patrón "Open Session in View" (mejor para rendimiento y evitar problemas de LazyInitialization)
spring.jpa.open-in-view=false
# Formatea las consultas SQL en los logs para mayor legibilidad
spring.jpa.properties.hibernate.format_sql=true
# Timeout por query: 30 segundos máximo por consulta
spring.jpa.properties.jakarta.persistence.query.timeout=30000
# Lo mismo para las consultas que no pasan por JPA (JdbcTemplate: marcar pagos, contadores)
spring.jdbc.template.query-timeout=30s
# Carga en lotes de las relaciones (usuarios, clientes, estados, maestras...): un listado
# de N filas hace unas pocas consultas IN (...) en vez de una por fila (BD remota)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Activa la generación de estadísticas de Hibernate (útil para depuración y análisis de rendimiento)
#spring.jpa.properties.hibernate.generate_statistics=true

# Configuración de timeouts de servidor
# Timeout para conexiones HTTP idle en Tomcat (60 segundos)
server.tomcat.connection-timeout=60000
# Duración de la sesión del login. Antes el usuario quedaba recordado en el navegador
# sin caducar; ahora dura 30 días de inactividad y sobrevive a cerrar el navegador
# (cookie con caducidad), así que en el día a día no hay que volver a entrar.
server.servlet.session.timeout=${AURA_SESSION_TIMEOUT:30d}
server.servlet.session.cookie.max-age=${AURA_SESSION_TIMEOUT:30d}
# Las sesiones sobreviven a los reinicios del backend (los usuarios no tienen que volver
# a entrar en cada despliegue). SesionesEnDisco las va guardando en ~/.aura/sesiones según
# se usan, así que aguantan también un kill -9; esta línea queda de reserva por si esa
# carpeta no se pudiera usar (entonces solo se guardan al parar de forma ordenada).
server.servlet.session.persistent=true

# Sesión del login (SecurityConfig): cookie no legible desde JavaScript, solo para el
# mismo sitio y nunca en la URL. Con HTTPS delante, AURA_COOKIE_SECURE=true.
# Nombre propio (y configurable): PRE y PRO comparten IP y las cookies no distinguen puerto.
server.servlet.session.cookie.name=${AURA_SESSION_COOKIE:AURA_SESSION}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${AURA_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
# Detrás de nginx: IP real del cliente (X-Forwarded-For) solo si llega desde un proxy interno
server.forward-headers-strategy=native
# Solo se cree la cabecera X-Forwarded-For si la petición llega desde estas IP (el
# propio equipo: nginx en la misma máquina). Si nginx está en otro equipo, poner su IP
# en la variable de entorno SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES (expresión regular,
# p. ej. 192\.168\.1\.10). Sin placeholder: dentro de ${...} se perderían las barras.
server.tomcat.remoteip.internal-proxies=127\\.\\d+\\.\\d+\\.\\d+|0:0:0:0:0:0:0:1|::1

# Clave AES-256 con la que se cifran las contraseñas de Usuarios (los administradores
# las pueden consultar; en la BD y en sus copias ya no están en claro).
# NO CAMBIARLA: con otra clave ninguna contraseña cifrada se podría leer y nadie
# podría entrar. Al arrancar se cifran las que sigan en claro; para volver a la
# versión anterior de la aplicación, arrancar antes esta con
# aura.seguridad.contrasenas-al-arrancar=descifrar.
aura.seguridad.clave-contrasenas=+nxbp1sJ9AT6Ps7vZWdClp19z/LcaOfnVl1msedLykY=
aura.seguridad.contrasenas-al-arrancar=cifrar

# Errores: nunca trazas ni mensajes internos en las respuestas
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Cada línea del log lleva el código de su petición y el usuario, p. ej. [3f9a1c u7]
# (lo pone AuraUserFilter; [-] fuera de una petición, como las tareas programadas).
# \u0020 es el espacio de separación (un espacio al final de la línea se pierde al editar)
logging.pattern.correlation=[%X{peticion:--}]\u0020

# Actuator: solo el health, sin detalles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS (lista de orígenes separados por comas). Vacío: solo mismo origen (proxy).
aura.cors.allowed-origins=${AURA_CORS_ALLOWED_ORIGINS:}
# Orígenes admitidos para el WebSocket /ws (patrones separados por comas)
aura.websocket.allowed-origin-patterns=${AURA_WS_ALLOWED_ORIGINS:*}

# Configuración de threading para manejar múltiples peticiones
# Número máximo de threads para procesar requests
server.tomcat.threads.max=200
# Número mínimo de threads siempre disponibles
server.tomcat.threads.min-spare=10
# Tamaño máximo de la cola de peticiones pendientes
server.tomcat.accept-count=100
# Número máximo de conexiones simultáneas que el servidor puede aceptar
server.tomcat.max-connections=10000

# Configuración de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
# Algo más que el fichero: la petición lleva también las cabeceras del multipart (un PDF
# de 10 MB justos se rechazaba). Igual que client_max_body_size 11m en nginx
spring.servlet.multipart.max-request-size=11MB
file.upload.base-dir=uploads/tareas
aura.uploads.contratos-path=uploads/contratos


# ---------------- Planificador (módulo de proyectos, presupuestos e inventario) ----------------
# Catálogo con el que arranca una instalación nueva (149 productos, marcas con logo y proveedores); no toca un inventario que ya exista
planificador.catalogo-inicial=${PLANIFICADOR_CATALOGO_INICIAL:true}
# Funciones del Planificador (encendidas por defecto; PLANNER_BUDGETER=0 / PLANNER_INVENTORY=0 las apaga)
planificador.funciones.presupuestador=${PLANNER_BUDGETER:true}
planificador.funciones.inventario=${PLANNER_INVENTORY:true}
# Dropbox: sin estas variables queda apagado (el Planificador responde como un servidor sin Dropbox)
planificador.dropbox.app-key=${DROPBOX_APP_KEY:}
planificador.dropbox.app-secret=${DROPBOX_APP_SECRET:}
planificador.dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:}
planificador.dropbox.base-path=${DROPBOX_BASE_PATH:}
planificador.dropbox.fichas-raiz=${DROPBOX_DATASHEETS_ROOT:}
planificador.dropbox.url-api=${DROPBOX_URL_API:https://api.dropboxapi.com}
planificador.dropbox.url-contenido=${DROPBOX_URL_CONTENIDO:https://content.dropboxapi.com}
# Temporizador diario de avisos de vencimiento (apagado por defecto; con solo-marcar no envía nada)
planificador.avisos.programado=${PLANIFICADOR_AVISOS_PROGRAMADO:false}
planificador.avisos.solo-marcar=${PLANIFICADOR_AVISOS_SOLO_MARCAR:false}
planificador.avisos.cron=${PLANIFICADOR_AVISOS_CRON:0 0 7 * * *}
