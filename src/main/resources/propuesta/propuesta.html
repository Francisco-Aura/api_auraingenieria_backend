<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuesta · Aura Ingeniería Energética</title>
<style>
:root { --y: #fed600; --g: #9d9ea1; --ink: #1f1f21; --label: #8a8b8e; }
* { box-sizing: border-box; margin: 0; }
b, strong { font-weight: 600; }
html, body { height: 100%; background: #e9eaec; font-family: Inter, "Segoe UI", Arial, sans-serif; color: var(--ink); overflow: hidden; }
.deck { position: fixed; inset: 0; }
.stage { width: 1123px; height: 794px; position: absolute; left: 50%; top: calc(50% - 15px); margin: -397px 0 0 -561.5px; background: #fff; overflow: hidden; transform-origin: center; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
.slide { position: absolute; inset: 0; isolation: isolate; opacity: 0; visibility: hidden; transition: opacity .55s ease, visibility .55s; padding: 70px 80px; }
.slide.active { opacity: 1; visibility: visible; }

/* Entradas: cada elemento con .in aparece escalonado según su --i cuando su diapositiva está activa */
.in { opacity: 0; }
.slide.active .in { animation: rise .75s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * .13s + .2s); }
.slide.active .in.pop { animation-name: pop; }
.slide.active .in.fade { animation-name: fade; }
.slide.active .in.grow { animation-name: grow; transform-origin: left center; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { opacity: 1; transform: scaleX(0); } to { opacity: 1; transform: none; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* Fondo de las páginas interiores: medios círculos amarillos arriba a la derecha y la marca abajo */
.deco { position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.suns { position: absolute; inset: 0; width: 100%; height: 100%; }
.slide.active .sg { animation: float 7s ease-in-out infinite; }
.slide.active .sg.b { animation-delay: -3s; } .slide.active .sg.c { animation-delay: -1.5s; }
.mark { position: absolute; right: 52px; bottom: 40px; width: 92px; }

/* Títulos: palabra en gris y otra sobre barra amarilla */
.kick { font-size: 17px; color: var(--label); margin-bottom: 4px; }
h2 { font-size: 46px; line-height: 1.12; font-weight: 700; color: var(--g); letter-spacing: -.5px; }
h2 .hl { display: inline-block; background: var(--y); color: #fff; padding: 0 12px; margin-left: 4px; }
.sub { font-size: 18px; color: var(--label); margin-top: 14px; }

/* Portada: foto a la derecha, el resto es texto */
.cover { padding: 0; background: #fff; }
.cphoto { position: absolute; right: 0; top: 0; height: 794px; width: auto; }
.clogo { position: absolute; left: 70px; top: 112px; width: 370px; }
.crule { position: absolute; left: 56px; top: 292px; width: 142px; height: 3px; background: var(--y); }
.ckick { position: absolute; left: 56px; top: 312px; font-size: 22px; font-weight: 700; color: var(--y); }
.ctitle { position: absolute; left: 52px; top: 358px; font-size: 76px; line-height: .98; font-weight: 700; letter-spacing: -2px; color: var(--g); }
.ctitle span { color: var(--y); }
.csub { position: absolute; left: 62px; top: 548px; font-size: 22px; color: var(--label); }
.cover .who { position: absolute; left: 62px; top: 616px; padding-left: 14px; border-left: 3px solid var(--y); }
.cover .who b { display: block; font-size: 17px; color: #6d6e71; margin-bottom: 6px; }
.cover .who span { font-size: 15px; color: var(--label); }
.cweb { position: absolute; left: 470px; top: 690px; display: flex; align-items: center; gap: 10px; background: var(--y); padding: 7px 16px 7px 12px; font-size: 27px; font-weight: 700; color: var(--g); box-shadow: 5px 5px 0 var(--g); }
.cweb img { width: 30px; }
.web img { width: 38px; }

/* Llave en mano */
.lead { font-size: 40px; line-height: 1.2; font-weight: 700; color: var(--g); max-width: 560px; margin-top: 30px; }
.lead em { font-style: normal; background: var(--y); color: #fff; padding: 0 8px; }
.turn { margin-top: 36px; max-width: 520px; font-size: 18px; line-height: 1.6; color: var(--label); }
.turn b { color: var(--ink); display: block; font-size: 20px; margin-bottom: 6px; }

/* Paso a paso */
.steps5 { display: flex; gap: 14px; margin-top: 54px; align-items: flex-end; height: 420px; }
.steps5 > div { flex: 1; border-radius: 6px 6px 0 0; padding: 22px 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; text-align: center; color: #fff; transform-origin: bottom; }
.steps5 b.n { font-size: 38px; font-weight: 700; }
.steps5 span { font-size: 16px; font-weight: 700; line-height: 1.3; }
.slide.active .steps5 > div.in { animation-name: tall; }
@keyframes tall { from { opacity: 0; transform: scaleY(.15); } to { opacity: 1; transform: none; } }

/* Proceso: una carretera con su línea central discontinua y los cinco hitos a ambos lados */
.tlwrap { position: relative; height: 424px; margin-top: 18px; }
.road { position: absolute; left: 0; right: 0; top: 170px; height: 88px; border-radius: 44px; transform-origin: left center;
  background:
    repeating-linear-gradient(90deg, var(--y) 0 44px, transparent 44px 80px) 50% 50% / calc(100% - 150px) 6px no-repeat,
    linear-gradient(#fff, #fff) 50% 10px / calc(100% - 110px) 2px no-repeat,
    linear-gradient(#fff, #fff) 50% calc(100% - 10px) / calc(100% - 110px) 2px no-repeat,
    #7d7e82; }
.road .cap { position: absolute; top: 12px; width: 64px; height: 64px; border-radius: 50%; background: var(--y); color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 700; box-shadow: 0 0 0 4px #fff; }
.road .cap.l { left: 12px; } .road .cap.r { right: 12px; }
/* «+» y «→» dibujados (no son letras de la fuente, que no quedan centradas en el círculo) */
.road .cap svg { display: block; }
.tl { position: absolute; width: 200px; border: 2px solid var(--y); border-radius: 14px; background: #fff; padding: 12px 10px 14px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,.07); }
.tl b.n { display: block; color: #e8b800; font-size: 34px; font-weight: 700; line-height: 1.1; }
.tl b.t { display: block; font-size: 17px; line-height: 1.2; margin-top: 2px; }
.tl span { display: block; font-size: 13px; color: var(--label); margin-top: 5px; }
.tl.up { bottom: 288px; } .tl.down { top: 292px; }
.tl .stem { position: absolute; left: 50%; width: 2px; margin-left: -1px; background: #c3c4c7; }
.tl.up .stem { top: 100%; height: 50px; } .tl.down .stem { bottom: 100%; height: 50px; }
.tl .dot { position: absolute; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--y); border: 4px solid #fff; box-shadow: 0 0 0 2px #7d7e82; }
.tl.up .dot { top: calc(100% + 40px); } .tl.down .dot { bottom: calc(100% + 40px); }

/* Filas de datos */
.rows { margin-top: 64px; }
.row { display: flex; align-items: baseline; gap: 24px; padding: 16px 0; border-bottom: 1px solid #ececee; font-size: 22px; max-width: 720px; }
.row i { font-style: normal; color: var(--label); width: 280px; }
.row b { font-weight: 700; }

/* Tarjetas de equipos */
.cards { margin-top: 48px; display: grid; gap: 22px; max-width: 760px; }
.card { position: relative; border: 2px solid var(--g); border-radius: 14px; padding: 20px 28px 20px 40px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--y); border-radius: 12px 0 0 12px; }
.card i { font-style: normal; font-size: 16px; color: var(--label); }
.card b { display: block; font-size: 24px; margin-top: 4px; }

/* Estructura */
.opts { margin-top: 56px; display: flex; gap: 16px; }
.opt { flex: 1; height: 250px; border: 2px solid var(--g); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 14px; font-weight: 700; font-size: 18px; color: var(--label); }
.opt.on { background: var(--y); border-color: var(--y); color: var(--ink); }
.opt small { font-size: 14px; font-weight: 700; }

/* Garantías */
.war { margin-top: 58px; display: flex; gap: 28px; }
.war > div { flex: 1; }
.war .big { font-size: 78px; font-weight: 700; color: var(--y); line-height: 1; }
.war .yr { font-size: 20px; font-weight: 700; color: var(--g); margin: 6px 0 20px; }
.war b { display: block; font-size: 18px; margin-bottom: 8px; }
.war p { font-size: 14px; line-height: 1.5; color: var(--label); }

/* Económica */
.eco-top { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
.total { text-align: right; }
.total i { font-style: normal; font-size: 28px; font-weight: 700; color: var(--g); }
.total .amount { font-size: 62px; font-weight: 700; line-height: 1.1; margin-top: 6px; }
.total .line { height: 3px; background: var(--y); margin: 8px 0 8px auto; width: 380px; transform-origin: right; }
.total small { font-size: 16px; color: var(--label); }
.pay-title { font-size: 20px; color: var(--label); margin: 8px 0 20px; }
.pays { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 40px; }
.pay { display: flex; gap: 20px; align-items: center; }
.pay .pc { width: 86px; height: 86px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; font-weight: 700; flex: none; }
.pay:nth-child(odd) .pc { background: var(--y); color: var(--ink); }
.pay:nth-child(even) .pc { background: var(--g); color: #fff; }
.pay b { display: block; font-size: 19px; }
.pay span { font-size: 15px; color: var(--label); }
.pay em { display: block; font-style: normal; font-size: 14px; color: var(--g); margin-top: 2px; }

/* Condiciones */
.cols3 { margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.cols3 h4 { font-size: 17px; color: var(--ink); border-bottom: 3px solid var(--y); padding-bottom: 6px; margin-bottom: 10px; }
.cols3 p { font-size: 11.5px; line-height: 1.45; color: #5f6063; margin-bottom: 7px; }
.cols3 p b { color: var(--ink); }

/* Equipo y cierre */
.team { display: flex; gap: 40px; align-items: center; margin-top: 40px; }
.team img { width: 380px; height: 420px; object-fit: cover; border-radius: 16px; }
.team p { font-size: 22px; line-height: 1.6; color: var(--label); max-width: 420px; }
.team p b { color: var(--ink); }
.close { display: grid; place-items: center; text-align: center; height: 100%; }
.close h2 { font-size: 58px; }
.web { display: inline-flex; align-items: center; gap: 12px; margin-top: 30px; background: var(--y); padding: 10px 18px; font-size: 28px; font-weight: 700; color: var(--g); box-shadow: 5px 5px 0 var(--g); }

/* Logo de la empresa del cliente (diapositiva 2) */
.logo-slot { position: absolute; right: 96px; top: 392px; width: 380px; }
.logo-box { position: relative; height: 190px; display: grid; place-items: center; border-radius: 16px; border: 2px solid #e3e4e6; background: #fff; }
.logo-box img { position: absolute; inset: 18px; width: calc(100% - 36px); height: calc(100% - 36px); object-fit: contain; }
.logo-box.add { border: 2px dashed #cfd0d3; background: #fafafa; color: var(--label); font-size: 16px; font-weight: 700; cursor: pointer; transition: border-color .2s, color .2s; }
.logo-box.add:hover { border-color: var(--y); color: var(--ink); }
.logo-tools { margin-top: 8px; font-size: 13px; display: flex; gap: 14px; }
.logo-tools button { background: none; border: 0; padding: 0; color: var(--label); text-decoration: underline; cursor: pointer; font: inherit; }

/* Sol, haces de luz y placa de la diapositiva 2 (todo en bucle) */
.art { position: absolute; left: 76px; bottom: 62px; width: 420px; height: 262px; overflow: visible; }
.art .cl { stroke: #fff; stroke-width: 2; opacity: .8; }
.art .beam, .art .glow { opacity: .25; }
.slide.active .art .beam { animation: beam 3.6s ease-in-out infinite; }
.slide.active .art .glow { animation: glowpulse 3.6s ease-in-out infinite; }
@keyframes beam { 0%, 100% { opacity: .22; } 50% { opacity: .95; } }
@keyframes glowpulse { 0%, 100% { opacity: .1; } 50% { opacity: 1; } }
.art .sunp { transform-box: fill-box; transform-origin: 50% 50%; }
.slide.active .art .sunp { animation: sunpulse 3.6s ease-in-out infinite; }
@keyframes sunpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* Controles */
.nav { position: fixed; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 8px; z-index: 5; }
.nav button { width: 11px; height: 11px; border-radius: 50%; border: 0; background: #c4c5c8; cursor: pointer; padding: 0; transition: all .25s; }
.nav button.on { background: var(--y); width: 30px; border-radius: 6px; }
.bar { position: fixed; left: 0; top: 0; height: 4px; background: var(--y); z-index: 5; transition: width .5s; }
.hint { position: fixed; right: 14px; bottom: 10px; font-size: 12px; color: #8a8b8e; z-index: 5; }

/* Imprimir o guardar en PDF: una diapositiva por página, sin animaciones */
* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media print {
  @page { size: 297mm 210mm; margin: 0; }
  html, body { overflow: visible; height: auto; background: #fff; }
  .deck { position: static; display: block; }
  .stage { position: static; margin: 0; width: 297mm; height: auto; transform: none !important; box-shadow: none; overflow: visible; }
  .slide { position: relative; width: 297mm; height: 210mm; opacity: 1; visibility: visible; break-after: page; page-break-after: always; overflow: hidden; transition: none; }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  .in { opacity: 1 !important; animation: none !important; }
  .nav, .bar, .hint, .logo-tools, .logo-box.add { display: none; }
}

/* Estructura con dibujos */
.opts2 { margin-top: 56px; display: flex; gap: 18px; }
.opt2 { flex: 1; text-align: center; padding: 18px 10px 20px; border-radius: 16px; border: 2px solid transparent; }
.opt2 svg { width: 100%; height: 235px; }
.opt2 b { display: block; margin-top: 14px; font-size: 17px; line-height: 1.25; color: var(--label); }
.opt2 small { display: block; margin-top: 8px; font-size: 13px; font-weight: 700; color: #15803d; }
.opt2.on { border-color: var(--y); background: #fffbe0; }
.opt2.on b { color: var(--ink); }
.opt2 .pn { fill: #adb1b3; }
.opt2 .ps { fill: #9d9ea1; } .opt2 .gr { fill: #dfe3e3; }
.opt2 .sp { stroke: #fff; stroke-width: 1.8; opacity: .85; }
.opt2 .dl { stroke: #fff; stroke-width: 1.6; stroke-dasharray: 5 4; opacity: .9; }

/* Garantías sobre fondo negro, con tarjetas altas */
.slide.dark { background: #000; }
.slide.dark .kick { color: #d4d4d6; }
.wcards { margin-top: 36px; display: flex; gap: 16px; height: 440px; }
.wc { flex: 1; max-width: 340px; border-radius: 20px; padding: 22px 22px 18px; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink); }
.wc.w1 { background: #fff; border: 2px solid var(--y); }
.wc.w2 { background: #f4f4f2; border: 1px solid #e6e6e2; }
.wc.w3 { background: var(--g); color: #fff; }
.wc.w4 { background: var(--y); }
.wicon { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: rgba(0,0,0,.07); }
.w1 .wicon { background: #fff3c2; color: #d9a900; } .w3 .wicon { background: rgba(255,255,255,.25); } .w4 .wicon { background: rgba(0,0,0,.1); }
.wc .big { font-size: 84px; font-weight: 700; line-height: 1; }
.w1 .big { color: #fdc500; }
.wc .yr { font-size: 20px; font-weight: 700; margin: 4px 0 18px; opacity: .8; }
.wc b { display: block; font-size: 19px; margin-bottom: 8px; }
.wc p { font-size: 13.5px; line-height: 1.5; opacity: .82; }
.wfoot { border-top: 1px solid rgba(0,0,0,.12); padding-top: 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.w1 .wfoot { color: #d9a900; } .w3 .wfoot { border-color: rgba(255,255,255,.3); }

/* Económica con tarjetas */
.ecotitle { white-space: nowrap; }
.ecotitle .kick { margin: 0; }
.total { border-left: 1px solid #dcdde0; padding-left: 40px; }
.pays2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 26px; margin-top: 4px; }
.pay2 { position: relative; display: flex; align-items: center; gap: 22px; padding: 22px 24px 22px 32px; background: #fff; border: 1px solid #e3e4e6; border-radius: 18px; box-shadow: 0 8px 22px rgba(0,0,0,.06); }
.pay2::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 5px; border-radius: 0 5px 5px 0; background: var(--y); }
.pay2.g::before { background: var(--g); }
.pay2 .sq { width: 92px; height: 92px; border-radius: 18px; display: grid; place-items: center; font-size: 27px; font-weight: 700; background: var(--y); color: var(--ink); flex: none; }
.pay2.g .sq { background: var(--g); color: #fff; }
.pay2 b { display: block; font-size: 19px; }
.pay2 span { display: block; font-size: 15px; color: var(--label); margin-top: 2px; }
.pay2 em { display: block; font-style: normal; font-size: 14px; font-weight: 700; color: var(--g); margin-top: 8px; padding-top: 6px; border-top: 1px solid #e8e9eb; }

/* Condiciones en tarjetas */
.cgrid { margin-top: 34px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.cgrid.rows3 { margin-top: 14px; }
.cc { position: relative; background: #fff; border: 1px solid #e3e4e6; border-radius: 16px; padding: 18px 20px 20px; box-shadow: 0 6px 18px rgba(0,0,0,.05); }
.cc::before { content: ""; position: absolute; left: 20px; right: 20px; top: 0; height: 4px; border-radius: 0 0 4px 4px; background: var(--y); }
.cicon { width: 46px; height: 46px; border-radius: 12px; background: #fff3c2; color: #c99a00; display: grid; place-items: center; margin-bottom: 12px; }
.cc b { display: block; font-size: 17px; margin-bottom: 6px; }
.cc p { font-size: 14px; line-height: 1.5; color: #5f6063; }
.cgroup { margin-top: 28px; font-size: 15px; font-weight: 700; color: var(--g); letter-spacing: .04em; text-transform: uppercase; }
.rows3 .cc { padding: 20px 22px 22px; min-height: 186px; }
.rows3 .cc p { font-size: 14.5px; }

/* Proveedores */
.logos6 { margin-top: 56px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.lg { height: 170px; border: 1px solid #e3e4e6; border-radius: 18px; background: #fff; display: grid; place-items: center; padding: 26px 34px; box-shadow: 0 8px 22px rgba(0,0,0,.05); }
.lg img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* Conócenos */
.about { margin-top: 40px; display: flex; gap: 36px; align-items: flex-start; }
.aboutl { flex: 1; }
.aboutl p { font-size: 20px; line-height: 1.6; color: #5f6063; }
.sect { margin-top: 24px; font-size: 19px; }
.sect b { display: block; margin-bottom: 10px; }
.sect ul { list-style: none; padding: 0; }
.sect li { padding: 7px 0 7px 24px; position: relative; color: var(--label); font-weight: 700; }
.sect li::before { content: ""; position: absolute; left: 0; top: 16px; width: 10px; height: 10px; border-radius: 3px; background: var(--y); }
.aboutr { position: relative; width: 330px; flex: none; }
.aboutr img { width: 100%; height: 330px; object-fit: cover; border-radius: 18px; display: block; }
.stat { position: absolute; left: -34px; bottom: -22px; background: var(--y); border-radius: 14px; padding: 12px 18px; width: 230px; box-shadow: 0 8px 20px rgba(0,0,0,.12); }
.stat b { display: block; font-size: 32px; font-weight: 700; }
.stat span { font-size: 13px; line-height: 1.3; display: block; }
.stat.s2 { left: auto; right: -20px; bottom: -64px; background: var(--g); color: #fff; width: 210px; }
.refs { position: absolute; left: 80px; right: 150px; top: 604px; }
.refs > span { font-size: 17px; font-weight: 700; color: var(--g); }
.refs > div { margin-top: 14px; display: flex; gap: 20px; align-items: center; }
.refs img { flex: 1 1 0; min-width: 0; height: 50px; max-width: 112px; object-fit: contain; }

/* Aceptación y firma */
.acc { margin-top: 26px; max-width: 760px; font-size: 20px; line-height: 1.55; color: var(--label); }
.sign { margin-top: 44px; display: flex; background: #faf8f4; border: 1px solid #e7e4dc; border-left: 8px solid #f2b705; border-radius: 16px; }
.signl { flex: 1; padding: 30px 32px; display: flex; gap: 16px; border-right: 1px dashed #d9d6cd; }
.signl .cicon { background: var(--y); color: var(--ink); flex: none; }
.signl b { display: block; font-size: 22px; color: var(--g); }
.signl .who2 { display: block; font-size: 17px; font-weight: 700; margin: 6px 0 10px; }
.signl p { font-size: 15px; line-height: 1.5; color: var(--label); }
.signr { flex: 1; padding: 26px 32px; }
.signr b { display: block; font-size: 18px; color: var(--g); margin-bottom: 12px; }
.signr .box { height: 200px; border: 2px dashed #d3d4d6; border-radius: 14px; background: #fff; }

/* Instalaciones de referencia */
.refgrid { margin-top: 56px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
/* Dos diapositivas de instalaciones: la de las menores (4 en una fila) y la de las mayores (3), con tarjetas más anchas y foto más alta */
.refgrid.n4 { grid-template-columns: repeat(4, 1fr); }
.refgrid.n3 { grid-template-columns: repeat(3, 1fr); gap: 24px; }
.refgrid.n2 { grid-template-columns: repeat(2, 1fr); gap: 24px; }
.refgrid.n2 .rf img { height: 300px; }
.refgrid.n3 .rf img { height: 300px; }
.refgrid.n3 .rf b { font-size: 18px; }
.refgrid.n3 .rf span { font-size: 16px; }
.rf { background: #fff; border: 1px solid #e3e4e6; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.06); }
.rf img { width: 100%; height: 250px; object-fit: cover; display: block; }
.rf div { padding: 12px 14px 16px; }
.rf b { display: block; font-size: 15px; line-height: 1.25; }
.rf span { display: block; font-size: 14px; color: var(--label); margin-top: 5px; }
.rf em { display: inline-block; margin-top: 8px; font-style: normal; font-size: 12px; font-weight: 700; background: var(--y); padding: 2px 8px; border-radius: 6px; }

/* Galerías de fotos */
.gal { margin-top: 36px; display: grid; gap: 16px; height: 460px; }
.gal.g6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
.gal.g4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
.gal.g8 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
.gal.g5 { grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr); }
.gal.g5 img { grid-column: span 2; }
.gal.g5 img:nth-child(n+4) { grid-column: span 3; }

/* Encaje: disposición de los paneles en el proyecto, justo debajo del logo del cliente (que va primero, arriba) y dentro de un marco con el amarillo
   de la marca que se ajusta a la imagen, sin márgenes en blanco (se amplía al pulsarlo). Con encaje el logo sube a top 150; sin él se queda en 392. */
.logo-slot.con-encaje { top: 150px; }
.encaje-wrap { position: absolute; right: 96px; top: 392px; width: 380px; display: flex; justify-content: center; }
.encaje { margin: 0; max-width: 100%; padding: 8px; background: #fff; border: 3px solid var(--y); border-radius: 18px; cursor: zoom-in; line-height: 0; }
.encaje img { display: block; width: auto; height: auto; max-width: 100%; max-height: 230px; border-radius: 10px; }
.gal img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; box-shadow: 0 8px 22px rgba(0,0,0,.12); display: block; min-height: 0; }

/* Cierre con los datos de contacto */
.endslide { background: radial-gradient(circle at 0% 100%, #ffec5c 0, rgba(255, 236, 92, 0) 58%), #fff; }
.end { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 26px; }
.end img { width: 340px; }
.end h2 { font-size: 46px; }
.contact { display: flex; gap: 90px; margin-top: 12px; text-align: left; }
.contact b { display: block; font-size: 17px; color: var(--g); margin-bottom: 6px; }
.contact span { display: block; font-size: 19px; color: #5f6063; line-height: 1.6; }

/* Propuesta técnica: cifras grandes y especificaciones */
.kpis { margin-top: 36px; display: grid; grid-template-columns: 1.4fr 1fr 1fr .8fr; gap: 16px; }
.kpi { background: #fff; border: 1px solid #e3e4e6; border-radius: 18px; padding: 20px 20px 18px; box-shadow: 0 8px 22px rgba(0,0,0,.06); }
.kpi.y { background: var(--y); border-color: var(--y); }

.kpi.y .cicon { background: rgba(255,255,255,.55); color: var(--ink); }

.kpi.y i { color: #5a4d00; }
.specs { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }

.spec .cicon { margin: 0; flex: none; }
.spec i { display: block; font-style: normal; font-size: 13px; color: var(--label); }
.spec b { display: block; font-size: 19px; margin-top: 2px; min-height: 1.2em; }
.spec em { display: block; font-style: normal; font-size: 13px; color: var(--label); margin-top: 2px; }

/* Fotos ampliables */
.gal img, .rf img { cursor: zoom-in; transition: transform .25s ease, box-shadow .25s ease; }
.gal img:hover { transform: scale(1.015); }
#lb { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(10, 10, 12, .9); }
#lb.open { display: flex; animation: lbin .2s ease; }
@keyframes lbin { from { opacity: 0; } to { opacity: 1; } }

#lb button { position: absolute; border: 0; cursor: pointer; color: #fff; background: rgba(255,255,255,.14); width: 46px; height: 46px; border-radius: 50%; font-size: 28px; line-height: 1; display: grid; place-items: center; }
#lb button:hover { background: var(--y); color: var(--ink); }
#lb .lbx { top: 18px; right: 22px; } #lb .lbp { left: 22px; top: 50%; margin-top: -23px; } #lb .lbn { right: 22px; top: 50%; margin-top: -23px; }

@media print { #lb { display: none !important; } }

/* Paso a paso: columnas colgando del borde de arriba, cortadas por un semicírculo blanco */

.slide.active .steps .col.in, .slide.steps.active .col.in { animation-name: unfold; animation-duration: 1s; }
@keyframes unfold { from { opacity: 1; clip-path: inset(0 0 100% 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
.dtitle { position: absolute; left: 0; right: 0; top: 520px; text-align: center; }

// Se reduce a un máximo de 700 px de lado (un PNG conserva su transparencia); un SVG se guarda tal cual
picker.addEventListener('change', () => {
  const file = picker.files && picker.files[0]
  picker.value = ''
  if (!file) return
  const reader = new FileReader()
  reader.onload = () => {
    if (file.type === 'image/svg+xml') return setLogo(String(reader.result))
    const img = new Image()
    img.onload = () => {
      const k = Math.min(1, 700 / Math.max(img.width, img.height))
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) })
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
      setLogo(c.toDataURL(file.type === 'image/jpeg' ? 'image/jpeg' : 'image/png', 0.9))
    }
    img.onerror = () => alert('No se ha podido leer esa imagen.')
    img.src = String(reader.result)
  }
  reader.readAsDataURL(file)
})

function countUp(slide) {
  slide.querySelectorAll('[data-count]').forEach((el) => {
    const end = Number(el.dataset.count), dec = Number(el.dataset.dec || 0), suffix = el.dataset.suffix || '', prefix = el.dataset.prefix || ''
    const fmt = (v) => prefix + num(v, dec) + suffix
    const t0 = performance.now(), dur = 1300
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3)
      el.textContent = fmt(end * e)

  i = Math.max(0, Math.min(els.length - 1, i))
  if (i === cur) return
  els.forEach((s, k) => s.classList.toggle('active', k === i))
  dots.forEach((d, k) => d.classList.toggle('on', k === i))
  document.getElementById('bar').style.width = ((i + 1) / els.length) * 100 + '%'
  cur = i
  countUp(els[i])
  history.replaceState(null, '', '#' + (i + 1))
}
dots.forEach((d, i) => d.addEventListener('click', () => go(i)))
document.addEventListener('keydown', (e) => {
  if (lb.classList.contains('open')) {
    if (e.key === 'Escape') lbClose()
    else if (e.key === 'ArrowRight') lbShow(lbI + 1)
    else if (e.key === 'ArrowLeft') lbShow(lbI - 1)
    e.preventDefault()
    return
  }
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1) }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1) }
  else if (e.key === 'Home') go(0)
  else if (e.key === 'End') go(els.length - 1)
  else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()
})
stage.addEventListener('click', (e) => go(e.clientX < window.innerWidth / 2 ? cur - 1 : cur + 1))
let sx = null
stage.addEventListener('touchstart', (e) => (sx = e.touches[0].clientX), { passive: true })
stage.addEventListener('touchend', (e) => { if (sx !== null) { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); sx = null } })
// Los soles nunca se superponen con el contenido: se miden los textos y cajas de cada diapositiva y, si alguno entra en su zona,
// se encogen hacia la esquina hasta que dejen de tocarlo; si ni así caben, esa diapositiva se queda sin soles.
// El contenido de cada diapositiva con título se centra en el espacio que queda entre el título y la marca de abajo, en vez de
// quedarse pegado arriba: se baja lo justo (máximo 90 px) para que el aire de arriba y el de abajo sean parecidos.
const MARK_TOP = 684
function centerContent() {
  const keep = stage.style.transform
  stage.style.transform = 'none'
  allSlides.forEach((slide) => {
    const kids = [...slide.children].filter((c) => !c.classList.contains('deco'))
    const title = kids.filter((c) => c.matches('.kick, h2, .sub'))
    if (!kids.some((c) => c.tagName === 'H2')) return
    const content = kids.filter((c) => !title.includes(c))
    if (!content.length) return
    const abs = (c) => getComputedStyle(c).position === 'absolute'
    content.forEach((c) => {
      if (abs(c)) { if (c.dataset.top0 === undefined) c.dataset.top0 = getComputedStyle(c).top; c.style.top = c.dataset.top0 } else c.style.marginTop = ''
    })
    const titleBottom = Math.max(...title.map((c) => c.offsetTop + c.offsetHeight))
    const top = Math.min(...content.map((c) => c.offsetTop))
    const bottom = Math.max(...content.map((c) => c.offsetTop + c.offsetHeight))
    const delta = Math.max(0, Math.min(90, (MARK_TOP - bottom - (top - titleBottom)) / 2))
    if (delta < 4) return
    const flow = content.filter((c) => !abs(c))
    if (flow.length) flow[0].style.marginTop = parseFloat(getComputedStyle(flow[0]).marginTop) + delta + 'px'
    content.filter(abs).forEach((c) => (c.style.top = parseFloat(c.dataset.top0) + delta + 'px'))
  })
  stage.style.transform = keep
}
const SUN_LEFT = 797, SUN_BOTTOM = 226, SUN_MARGIN = 18, SUN_FLOAT = 12
function contentRects(slide, base) {
  const rects = []
  slide.querySelectorAll('.in').forEach((el) => {
    if (el.closest('.deco')) return
    const inline = [...el.children].every((c) => ['inline', 'inline-block'].includes(getComputedStyle(c).display))
    let list = [el.getBoundingClientRect()]
    if (inline) {
      const range = document.createRange()
      range.selectNodeContents(el)
      const parts = [...range.getClientRects()]
      if (parts.length) list = parts
    }
    list.forEach((r) => { if (r.width > 1 && r.height > 1) rects.push({ l: r.left - base.left, t: r.top - base.top, r: r.right - base.left, b: r.bottom - base.top }) })
  })
  return rects
}
function avoidSuns() {
  const keep = stage.style.transform
  stage.style.transform = 'none'
  // Cada diapositiva pide un tamaño máximo para sus soles; todas usan el menor, para que se vean iguales en toda la presentación
  const needs = allSlides.map((slide) => {
    const svg = slide.querySelector('.suns')
    if (!svg) return null
    svg.style.display = ''
    svg.style.transform = ''
    const rects = contentRects(slide, slide.getBoundingClientRect())
    const hits = (s) => {
      const left = 1123 - (1123 - SUN_LEFT) * s - SUN_MARGIN, bottom = SUN_BOTTOM * s + SUN_MARGIN + SUN_FLOAT
      return rects.some((r) => r.r > left && r.t < bottom)
    }
    return { svg, s: [1, 0.85, 0.7, 0.56, 0.44].find((k) => !hits(k)) }
  }).filter(Boolean)
  const common = Math.min(...needs.map((n) => (n.s === undefined ? 1 : n.s)))
  needs.forEach(({ svg, s }) => {
    if (s === undefined) { svg.style.display = 'none'; return }
    if (common < 1) { svg.style.transformOrigin = '100% 0'; svg.style.transform = 'scale(' + common + ')' }
  })
  stage.style.transform = keep
}
function fit() { const k = Math.min(window.innerWidth / 1123, (window.innerHeight - 30) / 794); stage.style.transform = `scale(${k})` }
window.addEventListener('resize', fit); fit()
stage.addEventListener('click', (e) => {
  const photo = e.target.closest && e.target.closest(PHOTOS)
  if (!photo) return
  e.stopPropagation()
  lbList = [...photo.closest('.slide').querySelectorAll(PHOTOS)]
  lbShow(lbList.indexOf(photo))
}, true)
const layout = () => { centerContent(); avoidSuns() }
layout()
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout)
fillCounts()
go(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1))
</script>
