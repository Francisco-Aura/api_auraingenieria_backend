# Pruebas del módulo Planificador: base H2 en memoria (modo MariaDB), sin tocar la base real
spring.datasource.url=jdbc:h2:mem:planificador;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Solo en las pruebas el esquema lo crea Hibernate; en MariaDB se aplican los scripts V20261110_* de src/main/resources/BBDD
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
