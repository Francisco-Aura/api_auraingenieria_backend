    - echo "=== Copiando JAR a PRO ==="
    - scp -v -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab target/*.jar babenza@$SSH_HOST:/tmp/aura.jar
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@$SSH_HOST "ls -la /tmp/aura.jar && du -sh /tmp/aura.jar"

    - echo "=== Ejecutando script de despliegue ==="
