image: maven:3.9.6-eclipse-temurin-17

stages:
  - deploy

# ======================================================
# DESPLIEGUE BACKEND PRE (rama release)
# SSH -> 5.34.148.92:2222
# ======================================================
deploy_backend_PRE:
  stage: deploy
  only:
    - release

  script:
    - echo "=== Limpiando Maven ==="
    - rm -rf .m2/repository
    - mvn dependency:purge-local-repository

    - echo "=== Configurando SSH PRE ==="
    - apt-get update -y
    - apt-get install -y openssh-client

    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_PRE" > ~/.ssh/id_rsa_gitlab
    - chmod 600 ~/.ssh/id_rsa_gitlab

    - ssh-keyscan -p 2222 5.34.148.92 >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

    - echo "=== Compilando ==="
    - mvn clean package -DskipTests -U

    - echo "=== Verificando JAR ==="
    - ls -la target/*.jar

    - echo "=== Backup ==="
    - ssh -p 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@5.34.148.92 "cp /tmp/aura.jar /tmp/aura.jar.backup.$(date +%Y%m%d_%H%M%S) || true"

    - echo "=== Copiando JAR ==="
    - scp -P 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab target/*.jar babenza@5.34.148.92:/tmp/aura.jar

    - echo "=== Ejecutando despliegue ==="
    - ssh -p 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@5.34.148.92 "bash /home/babenza/deploy_backend.sh"

# ======================================================
