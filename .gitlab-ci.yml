image: maven:3.9.6-eclipse-temurin-17

stages:
  - deploy

# Despliegue en PRE (Rama release → Raspberry PRE)
deploy_backend_PRE:
  stage: deploy
  only:
    - release
  script:
    # 1. Limpiar cache de Maven completamente
    - echo "=== Limpiando cache de Maven ==="
    - rm -rf .m2/repository
    - mvn dependency:purge-local-repository

    # 2. Configurar SSH para PRE
    - echo "=== Configurando SSH para PRE ==="
    - apt-get update -y && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_PRE" > ~/.ssh/id_rsa_gitlab
    - chmod 600 ~/.ssh/id_rsa_gitlab
    - ssh-keyscan 185.93.81.224 >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

    # 3. Compilar proyecto con dependencias frescas
    - echo "=== Compilando proyecto ==="
    - mvn clean package -DskipTests -U
    - echo "=== Verificando JAR generado ==="
    - ls -la target/*.jar
    - echo "=== Tamaño del JAR ==="
    - du -sh target/*.jar

    # 4. Verificar conexión SSH
    - echo "=== Verificando conexión SSH ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@185.93.81.224 "echo 'Conexión SSH exitosa'"

    # 5. Hacer backup del JAR anterior
    - echo "=== Creando backup del JAR anterior ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@185.93.81.224 "cp /tmp/aura.jar /tmp/aura.jar.backup.$(date +%Y%m%d_%H%M%S) || echo 'No existe JAR anterior'"

    # 6. Copiar JAR a Raspberry PRE
    - echo "=== Copiando JAR a PRE ==="
    - scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab target/*.jar babenza@185.93.81.224:/tmp/aura.jar
    - echo "=== Verificando JAR copiado ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@185.93.81.224 "ls -la /tmp/aura.jar && du -sh /tmp/aura.jar"

    # 7. Ejecutar script de despliegue
    - echo "=== Ejecutando despliegue en PRE ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@185.93.81.224 "bash /home/babenza/deploy_backend.sh"

    # 8. Verificar que el servicio esté funcionando
    - echo "=== Verificando estado del servicio ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@185.93.81.224 "systemctl status aura-backend || echo 'Servicio no encontrado'"

  # ELIMINAR CACHE COMPLETAMENTE
  # cache:
  #   paths:
  #     - .m2/repository

# Despliegue en PRO (Rama main → Raspberry PRO)
