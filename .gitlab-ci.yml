    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@5.34.149.250 "ls -la /tmp/aura.jar && du -sh /tmp/aura.jar"

    # 7. Ejecutar script de despliegue
    - echo "=== Ejecutando despliegue en PRO ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@5.34.149.250 "bash /home/babenza/deploy_backend.sh"

