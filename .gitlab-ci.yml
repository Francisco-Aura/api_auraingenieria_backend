stages:
  - deploy

default:
  tags:
    - aura-runner

variables:
  # El runner es persistente, por lo que reutilizamos directamente
  # el repositorio Maven del usuario gitlab-runner.
  MAVEN_OPTS: "-Dmaven.repo.local=/home/gitlab-runner/.m2/repository"


# ======================================================
# PLANTILLA COMUN BACKEND
# ======================================================

.deploy_backend:
  stage: deploy

  script:
    - set -euo pipefail

    - echo "========================================"
    - echo " AURA - BUILD BACKEND"
    - echo " Entorno: ${DEPLOY_ENV}"
    - echo "========================================"

    - echo "=== Informacion del runner ==="
    - hostname
    - whoami
    - java -version
    - mvn -version

    # ==================================================
    # Configuracion especifica por entorno
    # ==================================================

    - |
      rm -f src/main/resources/application-local.properties

      if [ -n "${SESSION_COOKIE_NAME:-}" ]; then
        echo "=== Cookie de sesion: ${SESSION_COOKIE_NAME} ==="

        echo \
          "server.servlet.session.cookie.name=${SESSION_COOKIE_NAME}" \
          > src/main/resources/application-local.properties
      fi

    # ==================================================
    # Build
    # ==================================================

    - echo "=== Compilando backend AURA ==="

    - mvn -B clean package -DskipTests

    - echo "=== Localizando JAR ==="

    - |
      JAR_FILE="$(
        find target \
          -maxdepth 1 \
          -type f \
          -name '*.jar' \
          ! -name '*.original' \
          | head -1
      )"

      if [ -z "$JAR_FILE" ]; then
        echo "ERROR: No se ha encontrado el JAR"
        exit 1
      fi

      if [ ! -s "$JAR_FILE" ]; then
        echo "ERROR: El JAR esta vacio"
        exit 1
      fi

      echo "JAR localizado:"
      ls -lh "$JAR_FILE"

      # Lo guardamos para el resto del bloque
      cp "$JAR_FILE" /tmp/aura-ci-${CI_PIPELINE_ID}.jar

    # ==================================================
    # SSH
    # ==================================================

    - echo "=== Comprobando SSH ${DEPLOY_ENV} ==="

    - |
      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "echo SSH_OK && hostname"

    # ==================================================
    # Transferencia
    # ==================================================

    - echo "=== Copiando JAR a ${DEPLOY_ENV} ==="

    - |
      scp \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        -o ServerAliveInterval=10 \
        -o ServerAliveCountMax=3 \
        "/tmp/aura-ci-${CI_PIPELINE_ID}.jar" \
        "babenza@${DEPLOY_HOST}:/tmp/aura.jar"

    - rm -f "/tmp/aura-ci-${CI_PIPELINE_ID}.jar"

    # ==================================================
    # Deploy
    # ==================================================

    - echo "=== Ejecutando deploy backend ${DEPLOY_ENV} ==="

    - |
      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "bash /home/babenza/deploy_backend.sh"

    # ==================================================
    # Health check
    # ==================================================

    - echo "=== Comprobando backend ${DEPLOY_ENV} ==="

    - |
      BACKEND_OK=0

      for i in $(seq 1 40); do

        if ssh \
          -o BatchMode=yes \
          -o ConnectTimeout=10 \
          "babenza@${DEPLOY_HOST}" \
          "curl -fsS http://127.0.0.1:8986/actuator/health 2>/dev/null" \
          | grep -q '"status":"UP"'
        then
          BACKEND_OK=1
          break
        fi

        echo "Esperando backend ${DEPLOY_ENV}... ${i}/40"
        sleep 5
      done

      if [ "$BACKEND_OK" -ne 1 ]; then

        echo "ERROR: Backend ${DEPLOY_ENV} no responde correctamente"

        ssh \
          -o BatchMode=yes \
          "babenza@${DEPLOY_HOST}" \
          "systemctl status backend --no-pager -l || true"

        exit 1
      fi

    - echo "========================================"
    - echo " BACKEND ${DEPLOY_ENV} DESPLEGADO OK"
    - echo "========================================"


# ======================================================
# DES
# develop -> Raspberry DES
# LAN: 192.168.100.4:22
# ======================================================

deploy_backend_DES:
  extends: .deploy_backend

  variables:
    DEPLOY_ENV: "DES"
    DEPLOY_HOST: "192.168.100.4"
    SESSION_COOKIE_NAME: "AURA_SESSION_DES"

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


# ======================================================
# PRE
# release -> Raspberry PRE
# LAN: 192.168.100.3:22
# ======================================================

deploy_backend_PRE:
  extends: .deploy_backend

  variables:
    DEPLOY_ENV: "PRE"
    DEPLOY_HOST: "192.168.100.3"
    SESSION_COOKIE_NAME: "AURA_SESSION_PRE"

  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'


# ======================================================
# PRO
# main -> Raspberry PRO
# LAN: 192.168.100.2:22
# ======================================================

deploy_backend_PRO:
  extends: .deploy_backend

  variables:
    DEPLOY_ENV: "PRO"
    DEPLOY_HOST: "192.168.100.2"
    SESSION_COOKIE_NAME: ""

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'