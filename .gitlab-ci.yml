stages:
  - deploy

default:
  tags:
    - aura-runner

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=/home/gitlab-runner/.m2/repository"


# ======================================================
# PLANTILLA COMUN BACKEND
# ======================================================

.deploy_backend:
  stage: deploy
  timeout: 2h

  script:
    - |
      set -euo pipefail

      echo "========================================"
      echo " AURA - BUILD BACKEND"
      echo " Entorno: ${DEPLOY_ENV}"
      echo " Destino: ${DEPLOY_HOST}"
      echo "========================================"

      echo
      echo "=== Informacion del runner ==="
      hostname
      whoami
      java -version
      mvn -version

      # ==================================================
      # Configuracion especifica por entorno
      # ==================================================

      echo
      echo "=== Configuracion del entorno ==="

      rm -f src/main/resources/application-local.properties

      if [ -n "${SESSION_COOKIE_NAME:-}" ]; then
        echo "Cookie de sesion: ${SESSION_COOKIE_NAME}"

        printf '%s\n' \
          "server.servlet.session.cookie.name=${SESSION_COOKIE_NAME}" \
          > src/main/resources/application-local.properties
      else
        echo "Sin cookie de sesion especifica para este entorno"
      fi

      # ==================================================
      # Build
      # ==================================================

      echo
      echo "=== Compilando backend AURA ==="

      mvn -B clean package -DskipTests

      echo
      echo "=== Localizando JAR ==="

      JAR_FILE="$(
        find target \
          -maxdepth 1 \
          -type f \
          -name '*.jar' \
          ! -name '*.original' \
          | head -1
      )"

      if [ -z "$JAR_FILE" ]; then
        echo "ERROR: No se ha encontrado ningun JAR"
        exit 1
      fi

      if [ ! -s "$JAR_FILE" ]; then
        echo "ERROR: El JAR esta vacio"
        exit 1
      fi

      echo "JAR localizado:"
      ls -lh "$JAR_FILE"

      TEMP_JAR="/tmp/aura-ci-${CI_PIPELINE_ID}.jar"

      cp "$JAR_FILE" "$TEMP_JAR"

      if [ ! -s "$TEMP_JAR" ]; then
        echo "ERROR: No se ha podido preparar el JAR temporal"
        exit 1
      fi

      # ==================================================
      # SSH
      # ==================================================

      echo
      echo "=== Comprobando SSH con ${DEPLOY_ENV} ==="

      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "echo SSH_OK && hostname && whoami"

      # ==================================================
      # Transferencia
      # ==================================================

      echo
      echo "=== Copiando JAR a ${DEPLOY_ENV} ==="

      scp \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        -o ServerAliveInterval=10 \
        -o ServerAliveCountMax=3 \
        "$TEMP_JAR" \
        "babenza@${DEPLOY_HOST}:/tmp/aura.jar"

      rm -f "$TEMP_JAR"

      # ==================================================
      # Deploy
      # ==================================================

      echo
      echo "=== Ejecutando deploy backend ${DEPLOY_ENV} ==="

      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        -o ServerAliveInterval=10 \
        -o ServerAliveCountMax=3 \
        "babenza@${DEPLOY_HOST}" \
        "bash /home/babenza/deploy_backend.sh"

      # ==================================================
      # Health check
      # ==================================================

      echo
      echo "=== Esperando backend ${DEPLOY_ENV} ==="

      BACKEND_OK=0

      for i in $(seq 1 40); do

        if ssh \
          -o BatchMode=yes \
          -o ConnectTimeout=10 \
          "babenza@${DEPLOY_HOST}" \
          "curl -fsS http://127.0.0.1:8986/actuator/health 2>/dev/null" \
          | grep -q '"status":"UP"'
        then
          BACKEND_OK=1
          echo "Backend ${DEPLOY_ENV} disponible"
          break
        fi

        echo "Esperando backend ${DEPLOY_ENV}... ${i}/40"
        sleep 5
      done

      if [ "$BACKEND_OK" -ne 1 ]; then
        echo
        echo "ERROR: Backend ${DEPLOY_ENV} no responde correctamente"

        ssh \
          -o BatchMode=yes \
          -o ConnectTimeout=10 \
          "babenza@${DEPLOY_HOST}" \
          "systemctl status backend.service --no-pager -l || true"

        exit 1
      fi

      # ==================================================
      # Resultado
      # ==================================================

      echo
      echo "========================================"
      echo " BACKEND ${DEPLOY_ENV} DESPLEGADO OK"
      echo "========================================"


# ======================================================
# DES
# develop -> aura-des
# 192.168.100.4
# ======================================================

deploy_backend_DES:
  extends: .deploy_backend

  variables:
    DEPLOY_ENV: "DES"
    DEPLOY_HOST: "192.168.100.4"
    SESSION_COOKIE_NAME: "AURA_SESSION_DES"

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


# ======================================================
# PRE
# release -> aura-pre
# 192.168.100.3
# ======================================================

deploy_backend_PRE:
  extends: .deploy_backend

  variables:
    DEPLOY_ENV: "PRE"
    DEPLOY_HOST: "192.168.100.3"
    SESSION_COOKIE_NAME: "AURA_SESSION_PRE"

  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'


# ======================================================
# PRO
# main -> aura-pro
# 192.168.100.2
# ======================================================

deploy_backend_PRO:
  extends: .deploy_backend

  variables:
    DEPLOY_ENV: "PRO"
    DEPLOY_HOST: "192.168.100.2"
    SESSION_COOKIE_NAME: ""

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'