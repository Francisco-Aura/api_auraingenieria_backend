image: maven:3.9.6-eclipse-temurin-17

stages:
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository/

.deploy_backend:
  stage: deploy

  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - |
      if [ -f "$DEPLOY_PRIVATE_KEY" ]; then
        echo "Usando clave SSH desde variable GitLab tipo File"
        cp "$DEPLOY_PRIVATE_KEY" ~/.ssh/id_rsa_gitlab
      else
        echo "Usando clave SSH desde variable GitLab normal"
        printf '%s\n' "$DEPLOY_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa_gitlab
      fi

    - chmod 600 ~/.ssh/id_rsa_gitlab

    - |
      echo "=== Validando clave SSH ==="
      ssh-keygen -y -f ~/.ssh/id_rsa_gitlab > /dev/null || {
        echo "ERROR: La clave privada SSH no es valida"
        exit 1
      }

    - |
      echo "=== Registrando host SSH ==="
      ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

    - chmod 600 ~/.ssh/known_hosts

    - |
      echo "=== Probando conexion SSH ==="
      ssh \
        -p "$DEPLOY_PORT" \
        -i ~/.ssh/id_rsa_gitlab \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "echo SSH_OK && hostname"

  script:
    - echo "=== Compilando backend AURA ==="
    - mvn -B clean package -DskipTests -U

    - echo "=== Localizando JAR ==="
    - JAR_FILE="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -1)"
    - test -n "$JAR_FILE"
    - ls -lh "$JAR_FILE"

    - echo "=== Copiando JAR ==="
    - |
      scp \
        -P "$DEPLOY_PORT" \
        -i ~/.ssh/id_rsa_gitlab \
        "$JAR_FILE" \
        "babenza@${DEPLOY_HOST}:/tmp/aura.jar"

    - echo "=== Desplegando backend ==="
    - |
      ssh \
        -p "$DEPLOY_PORT" \
        -i ~/.ssh/id_rsa_gitlab \
        "babenza@${DEPLOY_HOST}" \
        "bash /home/babenza/deploy_backend.sh"


# ======================================================
# DES
# develop -> Raspberry DES AURA
# SSH -> 5.34.148.92:2223
# WEB -> http://5.34.148.92:8081
# ======================================================

deploy_backend_DES:
  extends: .deploy_backend

  variables:
    DEPLOY_HOST: "5.34.148.92"
    DEPLOY_PORT: "2223"
    DEPLOY_PRIVATE_KEY: "$SSH_PRIVATE_KEY_DES"

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


# ======================================================
# PRE
# release -> Raspberry PRE AURA
# SSH -> 5.34.148.92:2222
# ======================================================

deploy_backend_PRE:
  extends: .deploy_backend

  variables:
    DEPLOY_HOST: "5.34.148.92"
    DEPLOY_PORT: "2222"
    DEPLOY_PRIVATE_KEY: "$SSH_PRIVATE_KEY_PRE"

  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'


# ======================================================
# PRO
# main -> Raspberry PRO AURA
# SSH -> 5.34.148.92:22
# ======================================================

deploy_backend_PRO:
  extends: .deploy_backend

  variables:
    DEPLOY_HOST: "5.34.148.92"
    DEPLOY_PORT: "22"
    DEPLOY_PRIVATE_KEY: "$SSH_PRIVATE_KEY"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'