image: maven:3.9.6-eclipse-temurin-17

stages:
  - deploy

.deploy_template: &deploy_template
  before_script:
    - echo "=== Limpiando cache de Maven ==="
    - rm -rf .m2/repository
    - mvn dependency:purge-local-repository

    - echo "=== Instalando SSH client ==="
    - apt-get update -y && apt-get install -y openssh-client

    - echo "=== Configurando SSH ==="
    - mkdir -p ~/.ssh
    - if [ -z "$SSH_PRIVATE_KEY" ]; then echo "ERROR: SSH_PRIVATE_KEY no está definida"; exit 1; fi
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa_gitlab
    - chmod 600 ~/.ssh/id_rsa_gitlab
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
    - echo "=== Verificando archivos SSH ==="
    - ls -la ~/.ssh

deploy_backend_PRE:
  stage: deploy
  only:
    - release
  variables:
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY_PRE
    SSH_HOST: 5.34.148.141
  <<: *deploy_template
  script:
    - echo "=== Compilando proyecto ==="
    - mvn clean package -DskipTests -U
    - echo "=== Verificando JAR generado ==="
    - ls -la target/*.jar
    - du -sh target/*.jar

    - echo "=== Verificando conexión SSH ==="
    - ssh -v -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@$SSH_HOST "echo 'Conexión SSH exitosa'"

    - echo "=== Haciendo backup del JAR anterior ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@$SSH_HOST "cp /tmp/aura.jar /tmp/aura.jar.backup.$(date +%Y%m%d_%H%M%S) || echo 'No existe JAR anterior'"

    - echo "=== Copiando JAR a PRE ==="
    - scp -v -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab target/*.jar babenza@$SSH_HOST:/tmp/aura.jar
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@$SSH_HOST "ls -la /tmp/aura.jar && du -sh /tmp/aura.jar"

    - echo "=== Ejecutando script de despliegue ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@$SSH_HOST "bash /home/babenza/deploy_backend.sh"

    - echo "=== Verificando estado del servicio ==="
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_gitlab babenza@$SSH_HOST "systemctl status aura-backend || echo 'Servicio no encontrado'"

deploy_backend_PRO:
  stage: deploy
  only:
    - main
  variables:
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    SSH_HOST: 5.34.149.250
  <<: *deploy_template
  script:
